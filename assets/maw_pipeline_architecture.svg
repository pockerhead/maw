<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MAW pipeline architecture with modes</title>
<desc>Sequential adversarial pipeline showing the agent stages, the isolated premise-challenge gate, and which modes activate which subset</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .box { stroke-width: 0.5; }
  .neutral { fill: rgb(68,68,65); stroke: rgb(180,178,169); }
  .plan    { fill: rgb(60,52,137); stroke: rgb(175,169,236); }
  .impl    { fill: rgb(8,80,65);  stroke: rgb(93,202,165); }
  .review  { fill: rgb(113,43,19); stroke: rgb(240,153,123); }
  .t-neutral { fill: rgb(211,209,199); }
  .t-plan { fill: rgb(206,203,246); }  .s-plan { fill: rgb(175,169,236); }
  .t-impl { fill: rgb(159,225,203); }  .s-impl { fill: rgb(93,202,165); }
  .t-review { fill: rgb(245,196,179); } .s-review { fill: rgb(240,153,123); }
  .title { font-size: 14px; font-weight: 500; }
  .sub   { font-size: 12px; font-weight: 400; }
  .lbl   { font-size: 12px; font-weight: 400; fill: rgb(194,192,182); }
  .legend { font-size: 14px; font-weight: 500; fill: rgb(211,209,199); }
  .flow  { fill: none; stroke: rgb(156,154,146); stroke-width: 1.5; }
  .tick  { fill: none; stroke: rgb(156,154,146); stroke-width: 0.5; stroke-dasharray: 4 3; }
  .note  { fill: rgb(194,192,182); }
</style>
</defs>

<!-- Mode legend -->
<rect class="box neutral" x="40" y="20" width="600" height="44" rx="8"/>
<text class="legend" x="340" y="36" text-anchor="middle" dominant-baseline="central">Modes</text>
<circle cx="100" cy="52" r="5" fill="rgb(127,119,221)"/><text class="lbl" x="112" y="52" dominant-baseline="central">full</text>
<circle cx="190" cy="52" r="5" fill="rgb(29,158,117)"/><text class="lbl" x="202" y="52" dominant-baseline="central">brainstorm</text>
<circle cx="310" cy="52" r="5" fill="rgb(55,138,221)"/><text class="lbl" x="322" y="52" dominant-baseline="central">deep-research</text>
<circle cx="450" cy="52" r="5" fill="rgb(216,90,48)"/><text class="lbl" x="462" y="52" dominant-baseline="central">small-fix</text>

<!-- task.md -->
<rect class="box neutral" x="260" y="86" width="160" height="44" rx="8"/>
<text class="title t-neutral" x="340" y="108" text-anchor="middle" dominant-baseline="central">task.md</text>
<line class="flow" x1="340" y1="130" x2="340" y2="158" marker-end="url(#arrow)"/>

<!-- Clarifier -->
<rect class="box plan" x="210" y="158" width="260" height="56" rx="8"/>
<text class="title t-plan" x="340" y="180" text-anchor="middle" dominant-baseline="central">Clarifier</text>
<text class="sub s-plan" x="340" y="200" text-anchor="middle" dominant-baseline="central">Resolves ambiguity</text>
<circle cx="480" cy="186" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="186" r="5" fill="rgb(29,158,117)"/>
<line class="flow" x1="340" y1="214" x2="340" y2="242" marker-end="url(#arrow)"/>

<!-- Premise challenge (isolated) -->
<rect class="box plan" x="210" y="242" width="260" height="56" rx="8"/>
<text class="title t-plan" x="340" y="264" text-anchor="middle" dominant-baseline="central">Premise challenge</text>
<text class="sub s-plan" x="340" y="284" text-anchor="middle" dominant-baseline="central">Isolated — attacks the premise</text>
<circle cx="480" cy="270" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="270" r="5" fill="rgb(29,158,117)"/><circle cx="508" cy="270" r="5" fill="rgb(55,138,221)"/>
<text class="note" style="font-size:12px" x="526" y="264" dominant-baseline="central">halt to human</text>
<text class="note" style="font-size:12px" x="526" y="280" dominant-baseline="central">if suspect</text>
<line class="flow" x1="340" y1="298" x2="340" y2="326" marker-end="url(#arrow)"/>

<!-- Planner -->
<rect class="box plan" x="210" y="326" width="260" height="56" rx="8"/>
<text class="title t-plan" x="340" y="348" text-anchor="middle" dominant-baseline="central">Planner</text>
<text class="sub s-plan" x="340" y="368" text-anchor="middle" dominant-baseline="central">Web search + plan</text>
<circle cx="480" cy="354" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="354" r="5" fill="rgb(29,158,117)"/><circle cx="508" cy="354" r="5" fill="rgb(55,138,221)"/>
<line class="flow" x1="340" y1="382" x2="340" y2="410" marker-end="url(#arrow)"/>

<!-- Plan review x2 -->
<rect class="box plan" x="210" y="410" width="260" height="56" rx="8"/>
<text class="title t-plan" x="340" y="432" text-anchor="middle" dominant-baseline="central">Plan review (x2)</text>
<text class="sub s-plan" x="340" y="452" text-anchor="middle" dominant-baseline="central">Adversarial verification</text>
<circle cx="480" cy="438" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="438" r="5" fill="rgb(29,158,117)"/><circle cx="508" cy="438" r="5" fill="rgb(55,138,221)"/>
<text class="note" style="font-size:12px" x="526" y="438" dominant-baseline="central" fill="rgb(29,158,117)">stop</text>
<text class="note" style="font-size:12px" x="526" y="454" dominant-baseline="central" fill="rgb(55,138,221)">stop</text>
<line class="flow" x1="340" y1="466" x2="340" y2="494" marker-end="url(#arrow)"/>

<!-- Implementer -->
<rect class="box impl" x="210" y="494" width="260" height="56" rx="8"/>
<text class="title t-impl" x="340" y="516" text-anchor="middle" dominant-baseline="central">Implementer</text>
<text class="sub s-impl" x="340" y="536" text-anchor="middle" dominant-baseline="central">Writes code</text>
<circle cx="480" cy="522" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="522" r="5" fill="rgb(216,90,48)"/>
<line class="flow" x1="340" y1="550" x2="340" y2="578" marker-end="url(#arrow)"/>

<!-- Code review + Fixer -->
<rect class="box review" x="210" y="578" width="260" height="56" rx="8"/>
<text class="title t-review" x="340" y="600" text-anchor="middle" dominant-baseline="central">Code review + Fixer</text>
<text class="sub s-review" x="340" y="620" text-anchor="middle" dominant-baseline="central">Assumes mistakes, fixes</text>
<circle cx="480" cy="606" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="606" r="5" fill="rgb(216,90,48)"/>
<line class="flow" x1="340" y1="634" x2="340" y2="662" marker-end="url(#arrow)"/>

<!-- QA -->
<rect class="box impl" x="210" y="662" width="260" height="44" rx="8"/>
<text class="title t-impl" x="340" y="684" text-anchor="middle" dominant-baseline="central">QA</text>
<circle cx="480" cy="684" r="5" fill="rgb(127,119,221)"/><circle cx="494" cy="684" r="5" fill="rgb(216,90,48)"/>

<!-- File artifacts on the left (one per stage) -->
<text class="lbl" x="190" y="190" text-anchor="end">TASK_FINAL.md</text><line class="tick" x1="196" y1="190" x2="208" y2="190"/>
<text class="lbl" x="190" y="274" text-anchor="end">PREMISE_CHALLENGE.md</text><line class="tick" x1="196" y1="274" x2="208" y2="274"/>
<text class="lbl" x="190" y="358" text-anchor="end">PLAN.md</text><line class="tick" x1="196" y1="358" x2="208" y2="358"/>
<text class="lbl" x="190" y="442" text-anchor="end">PLAN_FINAL.md</text><line class="tick" x1="196" y1="442" x2="208" y2="442"/>
<text class="lbl" x="190" y="526" text-anchor="end">IMPL_SUMMARY.md</text><line class="tick" x1="196" y1="526" x2="208" y2="526"/>
<text class="lbl" x="190" y="610" text-anchor="end">IMPL_REVIEW.md</text><line class="tick" x1="196" y1="610" x2="208" y2="610"/>
<text class="lbl" x="190" y="688" text-anchor="end">QA_REPORT.md</text><line class="tick" x1="196" y1="688" x2="208" y2="688"/>
<text class="lbl" x="190" y="708" text-anchor="end" style="opacity:0.75">+ metrics.md (every run)</text>

<!-- No shared context annotation -->
<text class="note" x="56" y="474" text-anchor="start" style="font-size:12px">No shared context</text>
<text class="note" x="56" y="490" text-anchor="start" style="font-size:12px">Files only</text>
<line x1="148" y1="482" x2="208" y2="482" stroke="rgb(153,60,29)" stroke-width="0.5" stroke-dasharray="3 3"/>
</svg>
